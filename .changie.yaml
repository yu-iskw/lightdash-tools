# Changie configuration
changesDir: .changes
unreleasedDir: unreleased
configDir: .changes/config
headerPath: header.md
changelogPath: CHANGELOG.md
versionPrefix: v
# Keep empty extension to match existing version files (e.g. .changes/0.6.0.)
versionExt: ''

kinds:
  - label: Features
    key: feat
    auto: minor
  - label: Bug Fixes
    key: fix
    auto: patch
  - label: Documentation
    key: docs
    auto: patch
  - label: Refactors
    key: refactor
    auto: patch
  - label: Performance
    key: perf
    auto: patch
  - label: Tests
    key: test
    auto: none
  - label: Chores
    key: chore
    auto: none

components: []

# Format for each version in the changelog
# Kind templates use {{.Kind}} (label), not {{.Label}} — the latter fails silently in batch.
versionFormat: '## [{{.Version}}] - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body}}'

newlines:
  afterChangelogHeader: 1
  beforeChangelogVersion: 1
  endOfVersion: 1
