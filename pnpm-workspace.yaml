packages:
  - packages/*

allowBuilds:
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/node'
  - '@typescript-eslint/*'
  - '@vitest/eslint-plugin'
  - '@napi-rs/wasm-runtime'
  - baseline-browser-mapping
  - caniuse-lite
  - electron-to-chromium
  - eslint-plugin-unicorn
  - form-data
  - hono
  - knip
  - unbash
  - prettier
  - semver
  - side-channel
  - vite
  - axios
  - brace-expansion
  - postcss
  - fast-uri
  - tar
  - js-yaml
  - nanoid
  - '@modelcontextprotocol/server'
  - '@modelcontextprotocol/node'
  - '@modelcontextprotocol/client'
  - '@modelcontextprotocol/core'
  - '@hono/node-server'
  - redis
  - '@redis/*'
  - hono@4.12.34
  - brace-expansion@5.0.9

overrides:
  form-data: '>=4.0.6'
  js-yaml: 4.3.1
  nanoid: 3.3.18
  minimatch: '>=5.1.8'
  semver: '>=7.8.4'
  tar: '>=7.5.19'
  vite: 8.2.1
  brace-expansion: '>=5.0.8'
  postcss: '>=8.5.18'
  fast-uri: '>=3.1.4'
  axios: '>=1.18.0'
  '@hono/node-server': '>=2.0.12'
