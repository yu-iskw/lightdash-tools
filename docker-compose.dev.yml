services:
  mcp:
    profiles: [semantic-layer]
    build:
      context: .
      dockerfile: packages/mcp/Dockerfile
    command: [node, dist/bin.js, http]
    ports:
      # cloudflared quick tunnel: `cloudflared tunnel --url http://127.0.0.1:3100`
      - 3100:8080
      - 8080:8080
    env_file:
      - .env
    environment:
      NODE_ENV: development
      LIGHTDASH_TOOLS_MCP_HTTP_HOST: 0.0.0.0
      LIGHTDASH_TOOLS_MCP_HTTP_PORT: 8080
      # LIGHTDASH_TOOLS_MCP_PUBLIC_URL comes from .env (ephemeral *.trycloudflare.com host)
