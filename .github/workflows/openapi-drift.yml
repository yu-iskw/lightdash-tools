name: OpenAPI Drift Check

on:
  schedule:
    - cron: 0 6 * * 1
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Detect generated artifact drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Regenerate OpenAPI types
        run: pnpm --filter @lightdash-tools/common generate:types

      - name: Regenerate operation registry
        run: pnpm --filter @lightdash-tools/common generate:operation-registry

      - name: Check catalog client coverage
        run: pnpm --filter @lightdash-tools/common check:client-coverage

      - name: Regenerate CLI docs
        run: node scripts/generate-cli-docs.mjs

      - name: Format generated CLI docs
        run: pnpm exec prettier --write docs/profiles/ai-agent-ops/cli-ai-agents.md

      - name: Fail on uncommitted generated changes
        run: git diff --exit-code
