name: OpenAPI Drift Check

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Detect generated artifact drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Regenerate OpenAPI types
        run: pnpm --filter @lightdash-tools/common generate:types

      - name: Verify regenerated OpenAPI types compile
        run: pnpm --filter @lightdash-tools/common build

      - name: Regenerate operation registry
        run: pnpm --filter @lightdash-tools/common generate:operation-registry

      - name: Regenerate CLI docs (if script exists)
        run: |
          if node -e "const p=require('./packages/cli/package.json'); process.exit(p.scripts?.['generate-cli-docs'] ? 0 : 1)"; then
            pnpm --filter @lightdash-tools/cli generate-cli-docs
          else
            echo "generate-cli-docs not defined; skipping"
          fi

      - name: Fail on uncommitted generated changes
        run: git diff --exit-code
