name: SBOM

on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "packages/**/package.json"
      - .github/workflows/sbom.yml
  schedule:
    - cron: 17 3 * * 1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: Generate and scan SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          output-file: sbom.spdx.json
          artifact-name: >-
            ${{ github.event.repository.name }}-${{ github.sha }}.spdx.json
          upload-artifact-retention: 14
          upload-release-assets: false

      - name: Scan SBOM for vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: sbom.spdx.json
          severity-cutoff: high
          only-fixed: false
          fail-build: false
          output-format: json
          output-file: grype-report.json
          cache-db: true

      - name: Enforce High and Critical vulnerability gate
        shell: bash
        run: |
          set -euo pipefail
          jq -r '
            .matches[]
            | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")
            | [.vulnerability.severity, .vulnerability.id, (.artifact.name + "@" + .artifact.version), ((.vulnerability.fix.versions // []) | join(","))]
            | @tsv
          ' grype-report.json | sort -u | tee high-critical-vulnerabilities.tsv
          finding_count="$(wc -l < high-critical-vulnerabilities.tsv)"
          if ((finding_count > 0)); then
            echo "Found ${finding_count} unique High/Critical vulnerability matches."
            exit 1
          fi
          echo "No High or Critical vulnerabilities found."

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: >-
            ${{ github.event.repository.name }}-${{ github.sha }}-grype-report
          path: |
            grype-report.json
            high-critical-vulnerabilities.tsv
          retention-days: 14
          if-no-files-found: error
